<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Bini-Bini Beauty Lounge</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <!-- Back to Website Link -->
    <div class="auth-top-bar">
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Website</a>
    </div>

    <!-- Sign Up Container -->
    <div class="auth-container">
        <div class="auth-header">
            <h2>Create an Account</h2>
            <p>Join Bini-Bini Beauty Lounge for easy bookings and product orders.</p>
        </div>

        <!-- Sign Up Form -->
        <form id="signupForm" onsubmit="handleSignup(event)">
            
            <!-- Full Name Field -->
            <div class="form-group">
                <label for="signupName">Name</label>
                <input type="text" id="signupName" placeholder="Enter your full name" required>
            </div>

            <!-- Contact Number Field -->
            <div class="form-group">
                <label for="signupContact">Contact Number</label>
                <input type="tel" id="signupContact" placeholder="e.g., 09123456789" required>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" placeholder="Create a password" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; margin-top: 10px;">Submit</button>
        </form>

        <!-- Switch to Login -->
        <div class="auth-switch" style="text-align: center; margin-top: 20px; font-size: 14px;">
            <p>Already have an account? <a href="login.html" style="color: #c29b88; text-decoration: none; font-weight: 500;">Log In here</a></p>
        </div>
    </div>

    <!-- Sign Up Script with Custom Prompt -->
    <script>
        function handleSignup(event) {
            event.preventDefault();

            const name = document.getElementById('signupName').value.trim();
            const contact = document.getElementById('signupContact').value.trim();
            const password = document.getElementById('signupPassword').value.trim();

            // Save user details to localStorage
            localStorage.setItem("userName", name);
            localStorage.setItem("userContact", contact);
            localStorage.setItem("userPassword", password);
            localStorage.setItem("isLoggedIn", "true"); // Automatically log them in

            // Custom prompt message
            alert("Account created successfully! You can now order products and book a service.");
            
            // Redirect to home page
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
