<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Bini-Bini Beauty Lounge</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <!-- Back to Website Link -->
    <div class="auth-top-bar">
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Website</a>
    </div>

    <!-- Login Container -->
    <div class="auth-container">
        <div class="auth-header">
            <h2>Welcome Back, Binibini!</h2>
            <p>Log in to access your account and manage your bookings.</p>
        </div>

        <!-- Mock Test Accounts Helper Box -->
        <div class="mock-credentials-box">
            <h4>💡 Mock Accounts for Testing:</h4>
            <p><strong>Email:</strong> test@binibini.com | <strong>Password:</strong> password123</p>
        </div>

       <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            
            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="test@binibini.com" required>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="password123" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; margin-top: 10px;">Log In</button>
        
            <!-- Sign Up Option for First-Time Clients -->
            <div class="auth-switch" style="text-align: center; margin-top: 20px; font-size: 14px;">
                <p>First-time client? <a href="signup.html" style="color: #c29b88; text-decoration: none; font-weight: 500;">Create an account here</a></p>
            </div>
        </form>

    <!-- Login Script with Storage -->
    <script>
        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            // Simple Mock Validation check matching the helper box
            if (email === "test@binibini.com" && password === "password123") {
                
                // Save login state so basket page recognizes the user
                if (rememberMe) {
                    localStorage.setItem("isLoggedIn", "true");
                } else {
                    sessionStorage.setItem("isLoggedIn", "true");
                }

                alert("Login successful! Welcome to Bini-Bini Beauty Lounge.");
                
                // Redirect back to home or basket page
                window.location.href = "index.html";
            } else {
                alert("Invalid email or password. Please use the mock credentials shown above.");
            }
        }
    </script>
</body>
</html>
